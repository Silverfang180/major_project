[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chronicle-cli"
version = "0.1.0"
description = "Command-line interface for Chronicle prompt version control."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.24.0",
    "pyfiglet>=1.0.0",
    "python-dateutil>=2.8.0"
]

[project.scripts]
chronicle = "chronicle_cli.main:app"
