
services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/__pycache__
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/chronicle
      - ENVIRONMENT=development
    depends_on:
      db:
        condition: service_healthy
    networks:
      - chronicle-net
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=chronicle
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chronicle"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chronicle-net
    restart: unless-stopped

  adminer:
    image: adminer:4.8.1
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - chronicle-net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  chronicle-net:
    driver: bridge