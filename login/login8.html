<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chronicle — Warm Breeze Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#171018; --text:#fff8f3; --muted:#ccb8ae;
      --card:rgba(34,22,30,.62); --line:rgba(255,255,255,.14);
      --amber:#f6b26b; --coral:#ff8b7b; --mint:#8be5c5;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body,html{height:100%;overflow:hidden;background:var(--bg);font-family:Outfit,sans-serif;color:var(--text)}
    canvas{position:fixed;inset:0;z-index:0}
    .wrap{position:relative;z-index:10;height:100%;display:grid;place-items:center;padding:20px}
    .card{
      width:min(420px,92vw); padding:24px; border-radius:20px;
      background:var(--card); border:1px solid var(--line);
      backdrop-filter:blur(14px); box-shadow:0 24px 70px rgba(0,0,0,.45);
    }
    .meta{font-family:"JetBrains Mono",monospace;font-size:.7rem;color:#ffd9bf;letter-spacing:.14em;margin-bottom:10px}
    h2{font-size:1.65rem;margin-bottom:8px}
    .sub{font-size:.9rem;color:var(--muted);margin-bottom:16px}
    .f{display:grid;gap:10px}
    input{
      padding:12px;border-radius:11px;border:1px solid var(--line);
      background:rgba(255,255,255,.04);color:var(--text);outline:none;
    }
    input:focus{border-color:#ffd0a8;box-shadow:0 0 0 3px rgba(246,178,107,.2)}
    button{
      margin-top:10px;padding:12px;border:0;border-radius:11px;cursor:pointer;font-weight:700;
      background:linear-gradient(90deg,var(--amber),var(--coral)); color:#2f1712;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <main class="wrap">
    <section class="card">
      <div class="meta">CHRONICLE AUTH</div>
      <h2>Welcome back</h2>
      <div class="sub">A calm space to continue your workflow.</div>
      <form class="f" onsubmit="event.preventDefault()">
        <input type="email" placeholder="Email">
        <input type="password" placeholder="Password">
        <button>Continue</button>
      </form>
    </section>
  </main>

  <script>
    const c=document.getElementById('c'),ctx=c.getContext('2d');
    let w,h,t=0,mx=0,my=0,sx=0,sy=0;
    function resize(){w=c.width=innerWidth;h=c.height=innerHeight;mx=w/2;my=h/2;sx=mx;sy=my}
    addEventListener('resize',resize); resize();
    addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});

    const waves = Array.from({length:8},(_,i)=>({
      y: (i+1)*0.12,
      amp: 18 + i*6,
      speed: 0.003 + i*0.00035,
      thick: 1 + i*0.12,
      color: i%3===0 ? [246,178,107] : i%3===1 ? [255,139,123] : [139,229,197]
    }));

    function drawWave(baseY,amp,speed,color,th){
      ctx.beginPath();
      for(let x=0;x<=w;x+=8){
        const y = baseY + Math.sin(x*0.008 + t*speed)*amp + Math.cos(x*0.003 - t*speed*.9)*amp*.35;
        x===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      }
      ctx.strokeStyle=`rgba(${color[0]},${color[1]},${color[2]},0.16)`;
      ctx.lineWidth=th; ctx.stroke();
    }

    function loop(){
      t++;
      sx += (mx-sx)*0.04; sy += (my-sy)*0.04;
      ctx.fillStyle='#171018'; ctx.fillRect(0,0,w,h);

      // soft radial aura following mouse
      const g = ctx.createRadialGradient(sx,sy,0,sx,sy,260);
      g.addColorStop(0,'rgba(255,210,170,.10)'); g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g; ctx.fillRect(0,0,w,h);

      waves.forEach((wv,i)=>drawWave(h*wv.y + i*42, wv.amp, wv.speed, wv.color, wv.thick));
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
