<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chronicle — Neural Net Login (Light)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#f7f8fa;--text:#111;--muted:#616873;--accent:#111}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
#network{position:fixed;inset:0;z-index:0}
.auth-card{position:relative;z-index:10;width:100%;max-width:400px;padding:2.5rem;background:rgba(255,255,255,.8);backdrop-filter:blur(16px);border:1px solid rgba(0,0,0,.08);border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,.10);text-align:center}
.auth-card h1{font-size:1.5rem;font-weight:600;margin-bottom:.5rem}
.auth-card p{color:var(--muted);font-size:.85rem;margin-bottom:2rem}
.input-field{position:relative;margin-bottom:1rem;text-align:left}
.input-field input{width:100%;padding:.9rem 1rem;background:#fff;border:1px solid rgba(0,0,0,.12);border-radius:8px;color:#111;font-size:.9rem;transition:.3s}
.input-field input:focus{outline:none;border-color:#111}
.input-field label{position:absolute;top:-8px;left:10px;background:#fff;padding:0 5px;font-size:.7rem;color:var(--muted)}
.btn{width:100%;padding:.9rem;margin-top:1rem;background:#111;color:#fff;border:none;border-radius:8px;font-size:.95rem;font-weight:600;cursor:pointer;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.2)}
.footer-text{margin-top:1.5rem;font-size:.8rem;color:var(--muted)}
.footer-text a{color:#111;text-decoration:none}
</style>
</head>
<body>
<canvas id="network"></canvas>
<div class="auth-card">
  <h1>major_project</h1>
  <p>Authenticate to access the pipeline.</p>
  <form onsubmit="event.preventDefault();">
    <div class="input-field"><label>Email ID</label><input type="email" placeholder="dev@domain.com" required/></div>
    <div class="input-field"><label>Access Token</label><input type="password" placeholder="••••••••" required/></div>
    <button type="submit" class="btn">Initialize Session</button>
  </form>
  <div class="footer-text">Secure connection established. <a href="#">Learn more</a></div>
</div>
<script>
const canvas=document.getElementById('network'),ctx=canvas.getContext('2d');
let w,h,particles=[]; const properties={particleCount:80,particleRadius:1.5,maxVelocity:.5,lineLength:140,particleColor:'rgba(30,30,30,0.55)',lineColor:'rgba(30,30,30,'};
let mouse={x:-1000,y:-1000};
addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY}); addEventListener('mouseleave',()=>{mouse.x=-1000;mouse.y=-1000});
function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight} addEventListener('resize',resize); resize();
class Particle{constructor(){this.x=Math.random()*w;this.y=Math.random()*h;this.vx=(Math.random()-.5)*properties.maxVelocity;this.vy=(Math.random()-.5)*properties.maxVelocity}
position(){if(this.x+this.vx>w||this.x+this.vx<0)this.vx*=-1;if(this.y+this.vy>h||this.y+this.vy<0)this.vy*=-1;this.x+=this.vx;this.y+=this.vy}
draw(){ctx.beginPath();ctx.arc(this.x,this.y,properties.particleRadius,0,Math.PI*2);ctx.fillStyle=properties.particleColor;ctx.fill()}}
for(let i=0;i<properties.particleCount;i++)particles.push(new Particle());
function loop(){ctx.fillStyle='#f7f8fa';ctx.fillRect(0,0,w,h);
for(let i=0;i<particles.length;i++){particles[i].position();particles[i].draw();
for(let j=i+1;j<particles.length;j++){let dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y,dist=Math.sqrt(dx*dx+dy*dy);
if(dist<properties.lineLength){let o=1-(dist/properties.lineLength);ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);ctx.strokeStyle=properties.lineColor+(o*.35)+')';ctx.lineWidth=1;ctx.stroke()}}
let mdx=particles[i].x-mouse.x,mdy=particles[i].y-mouse.y,mDist=Math.sqrt(mdx*mdx+mdy*mdy);
if(mDist<180){ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(mouse.x,mouse.y);ctx.strokeStyle=properties.lineColor+(1-mDist/180)*.45+')';ctx.stroke()}}
requestAnimationFrame(loop)} loop();
</script>
</body>
</html>
