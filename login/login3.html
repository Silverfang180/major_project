<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chronicle — Glass Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0f172a;
    --text: #ffffff;
    --muted: #94a3b8;
    --border: rgba(255, 255, 255, 0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  /* Ethereal CSS Orbs */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    z-index: 0;
    animation: float 20s infinite ease-in-out alternate;
  }
  .orb-1 {
    width: 50vw; height: 50vw;
    background: rgba(56, 189, 248, 0.4); /* Cyan */
    top: -10vw; left: -10vw;
  }
  .orb-2 {
    width: 60vw; height: 60vw;
    background: rgba(139, 92, 246, 0.3); /* Purple */
    bottom: -20vw; right: -10vw;
    animation-delay: -10s;
  }
  @keyframes float {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(10vw, 5vw) scale(1.1); }
  }

  /* Glassmorphic Card */
  .glass-card {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 420px;
    padding: 2.5rem;
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 24px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  }

  .logo {
    display: inline-flex; align-items: center; justify-content: center;
    width: 48px; height: 48px; border-radius: 14px;
    background: linear-gradient(135deg, #38bdf8, #8b5cf6);
    margin-bottom: 1.5rem;
    box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3);
  }
  .logo svg { color: #fff; width: 24px; height: 24px; }

  h1 { font-size: 1.75rem; font-weight: 600; margin-bottom: 0.5rem; letter-spacing: -0.02em; }
  p.subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 2rem; line-height: 1.5; }

  .input-group { margin-bottom: 1.25rem; }
  .input-group label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.5rem; font-weight: 500;}
  
  .input-wrapper { position: relative; }
  .input-wrapper input {
    width: 100%; padding: 0.85rem 1rem;
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid var(--border);
    border-radius: 12px; color: #fff; font-size: 0.95rem;
    transition: all 0.3s ease;
  }
  .input-wrapper input:focus {
    outline: none; border-color: #38bdf8;
    background: rgba(56, 189, 248, 0.05);
    box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.1);
  }

  .options { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 1.5rem; }
  .options a { color: #38bdf8; text-decoration: none; font-weight: 500; transition: color 0.2s;}
  .options a:hover { color: #fff; }

  .primary-btn {
    width: 100%; padding: 0.9rem;
    background: #fff; color: #0f172a;
    border: none; border-radius: 12px;
    font-size: 0.95rem; font-weight: 600; cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .primary-btn:hover {
    transform: translateY(-2px); box-shadow: 0 10px 25px rgba(255, 255, 255, 0.2);
  }

  .separator {
    display: flex; align-items: center; margin: 1.5rem 0;
    color: var(--muted); font-size: 0.8rem;
  }
  .separator::before, .separator::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .separator span { padding: 0 1rem; }

  .github-btn {
    width: 100%; padding: 0.85rem;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border); border-radius: 12px;
    color: #fff; font-size: 0.95rem; font-weight: 500; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: background 0.2s;
  }
  .github-btn:hover { background: rgba(255, 255, 255, 0.1); }
</style>
</head>
<body>

<!-- Ambient CSS Background -->
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<!-- Foreground Glass Form -->
<div class="glass-card">
  <div class="logo">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
  </div>
  <h1>Welcome to Chronicle</h1>
  <p class="subtitle">Log in to manage your models, evaluate prompts, and track deployments.</p>

  <form onsubmit="event.preventDefault();">
    <div class="input-group">
      <label>Email</label>
      <div class="input-wrapper">
        <input type="email" placeholder="name@company.com" required/>
      </div>
    </div>
    <div class="input-group">
      <label>Password</label>
      <div class="input-wrapper">
        <input type="password" placeholder="••••••••" required/>
      </div>
    </div>
    
    <div class="options">
      <label style="display:flex; gap:8px; align-items:center; cursor:pointer; color:var(--muted)">
        <input type="checkbox" style="accent-color: #38bdf8; cursor:pointer;"/> Remember me
      </label>
      <a href="#">Forgot password?</a>
    </div>

    <button type="submit" class="primary-btn">Sign in</button>
  </form>

  <div class="separator"><span>or</span></div>

  <button class="github-btn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
    Continue with GitHub
  </button>
</div>

</body>
</html>
